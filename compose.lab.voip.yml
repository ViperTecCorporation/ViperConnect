# Optional local overlay. Credentials are imported outside the repository.
x-voice-client: &voice-client
  VOIP_SERVICE_URL: http://voip:3097
  VOIP_BRIDGE_URL: ws://voip:3097/v1/bridge/zapo
  VOIP_SERVICE_TOKEN: ${LAB_VOIP_SERVICE_TOKEN:?Importe o ambiente VoIP}

services:
  web:
    environment: *voice-client
  worker-zapo:
    environment: *voice-client
  voip:
    image: ${LAB_VOIP_IMAGE:?Importe a imagem VoIP da VPS}
    init: true
    restart: "no"
    networks: [lab]
    environment:
      UNOAPI_PROCESS_ROLE: voip
      PORT: "3097"
      VOIP_SERVICE_TOKEN: ${LAB_VOIP_SERVICE_TOKEN}
      VOIP_BRIDGE_TOKEN: ${LAB_VOIP_BRIDGE_TOKEN}
      VOIP_DOMAIN: "192.168.0.112"
      VOIP_LAN_DOMAIN: "192.168.0.112"
      VOIP_PUBLIC_WS_URL: ws://192.168.0.112:3097/sip/ws
      VOIP_STUN_URL: stun:192.168.0.112:3478
      VOIP_TURN_URL: turn:192.168.0.112:3478
      VOIP_TURN_USERNAME: ${LAB_TURN_USERNAME}
      VOIP_TURN_CREDENTIAL: ${LAB_TURN_CREDENTIAL}
      VOICE_CONFIG_STORAGE: sqlite
      VOIP_SQLITE_PATH: /home/u/app/data/voip.sqlite
      VOIP_CALL_RECORDING_ENABLED: "true"
      VOIP_CALL_RECORDING_DIR: /home/u/app/data/recordings
      SIP_RTP_ENABLED: "true"
      SIP_RTP_BIND_HOST: "0.0.0.0"
      SIP_RTP_BIND_IPV4: "0.0.0.0"
      SIP_RTP_BIND_IPV6: "::"
      SIP_RTP_PUBLIC_IPV4: "192.168.0.112"
      SIP_RTP_PUBLIC_IP: "192.168.0.112"
      SIP_RTP_PUBLIC_ADVERTISE_IP: "192.168.0.112"
      SIP_RTP_LAN_IP: "192.168.0.112"
      SIP_RTP_PORT: "5060"
      SIP_RTP_MEDIA_PORT_MIN: "12000"
      SIP_RTP_MEDIA_PORT_MAX: "12063"
      SIP_WEBRTC_UDP_PORT_MIN: "13001"
      SIP_WEBRTC_UDP_PORT_MAX: "13064"
      SIP_RTP_CODECS: PCMU,PCMA
      SIP_REGISTER_EXPIRES_SECONDS: "60"
    ports:
      - "127.0.0.1:3097:3097"
      - "192.168.0.112:3097:3097"
      - "192.168.0.112:5060:5060/udp"
      - "192.168.0.112:12000-12063:12000-12063/udp"
      - "192.168.0.112:13001-13064:13001-13064/udp"
    volumes: ["voip-data:/home/u/app/data"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3097/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  coturn:
    image: ${LAB_TURN_IMAGE:?Importe a imagem TURN da VPS}
    restart: "no"
    networks: [lab]
    environment:
      TURN_USERNAME: ${LAB_TURN_USERNAME}
      TURN_CREDENTIAL: ${LAB_TURN_CREDENTIAL}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        relay_ip=$$(hostname -i | awk '{print $$1}');
        exec turnserver -n --log-file=stdout --fingerprint --lt-cred-mech
        --realm=viperconnect-lab --server-name=viperconnect-lab
        --user="$${TURN_USERNAME}:$${TURN_CREDENTIAL}"
        --listening-ip=0.0.0.0 --relay-ip="$$relay_ip"
        --external-ip="192.168.0.112/$$relay_ip" --listening-port=3478
        --min-port=14001 --max-port=14064 --no-multicast-peers
        --no-tls --no-dtls --no-cli
    ports:
      - "192.168.0.112:3478:3478/udp"
      - "192.168.0.112:3478:3478/tcp"
      - "192.168.0.112:14001-14064:14001-14064/udp"

volumes:
  voip-data: {}
