name: Documentation Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
    paths:
      - '.github/workflows/docs-image.yml'
      - 'docs-site/**'
      - 'docs/**'
      - 'scripts/openapi-to-postman.mjs'
      - 'src/router.ts'
      - 'logos/viperconnect_icon.svg'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/docs-image.yml'
      - 'docs-site/**'
      - 'docs/**'
      - 'scripts/openapi-to-postman.mjs'
      - 'src/router.ts'
      - 'logos/viperconnect_icon.svg'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/viperteccorporation/viperconnect-docs
  DOCKER_PLATFORMS: linux/amd64,linux/arm64
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and publish documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docker Swarm examples
        run: |
          docker stack config -c docs/examples/docker-stack.unoapi-nginx.yml >/dev/null
          docker stack config -c docs/examples/docker-stack.unoapi-traefik.yml >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ViperConnect Developers
            org.opencontainers.image.description=Documentação e referência OpenAPI da ViperConnect

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docs-site/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=documentation
          cache-to: type=gha,mode=max,scope=documentation
