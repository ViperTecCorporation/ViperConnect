name: ci

on:
  workflow_dispatch:
    inputs:
      voip_ref:
        description: Ref do código de telefonia incorporado na imagem única
        required: false
        default: codex/zapo-uno-voice-bridge
  push:
    branches:  [ main develop ]
    tags:
      - 'v*.*.*'

  pull_request:
    branches: [ main develop ]

# Required to push images to GHCR
permissions:
  contents: read
  packages: write

env:
  DOCKER_PLATFORMS: linux/amd64,linux/arm64/v8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn check:baileys-lock
      - run: yarn install --frozen-lockfile
      - run: yarn check:baileys-lock
      - run: yarn lint
      - name: Install and validate isolated mobile registration runtime
        run: |
          npm ci --prefix lab/registration --omit=dev --ignore-scripts
          yarn check:mobile-runtime
      - run: yarn format
      - run: yarn test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout telephony source for the unified image
        uses: actions/checkout@v5
        with:
          repository: ViperTecCorporation/viperconnect-voip-service
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.voip_ref || 'codex/zapo-uno-voice-bridge' }}
          token: ${{ secrets.VOIP_REPOSITORY_TOKEN || github.token }}
          path: _build/voip-service

      - name: Resolve exact telephony source revision
        id: voip-source
        shell: bash
        run: |
          voip_sha="$(git -C _build/voip-service rev-parse HEAD)"
          echo "sha=${voip_sha}" >> "${GITHUB_OUTPUT}"
          echo "VoIP source revision: ${voip_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node.js for telephony validation
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: _build/voip-service/package-lock.json

      - name: Validate exact telephony source
        working-directory: _build/voip-service
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          platforms: ${{ env.DOCKER_PLATFORMS }}
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VOIP_SOURCE_SHA=${{ steps.voip-source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
