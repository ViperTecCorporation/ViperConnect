<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#9d3836">
    <title>ViperConnect</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logos/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/logos/apple-icon-180x180.png">
    <link rel="stylesheet" href="/app/styles.css?v=4.0.30-038921da">
  </head>
  <body>
    <div id="app">
      <div class="boot-state" role="status" data-boot-label>Carregando ViperConnect…</div>
    </div>
    <script>
      (() => {
        const savedLocale = localStorage.getItem('viperconnect_locale')
        const locale = savedLocale || navigator.language || 'pt-BR'
        const english = locale.toLowerCase().startsWith('en')
        document.documentElement.lang = english ? 'en' : 'pt-BR'
        document.querySelector('[data-boot-label]').textContent = english
          ? 'Loading ViperConnect…'
          : 'Carregando ViperConnect…'
      })()
    </script>
    <script src="/socket.io.min.js"></script>
    <script type="module" src="/app/main.js?v=4.0.30-038921da"></script>
  </body>
</html>
